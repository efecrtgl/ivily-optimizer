name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Sürüm tutarlılığı
        shell: pwsh
        run: ./scripts/check-version.ps1
      - run: npm ci
      - name: Arayüz denetimi (ESLint)
        run: npm run check
      - name: Arayüz testleri
        run: npm test
      - name: Arayüz derlemesi
        run: npm run build
      - name: Rust biçim denetimi
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust testleri
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee ../rust-test.log
      # İş günlükleri yalnızca depo yöneticilerine açıktır; başarısız testlerin
      # özeti herkesin görebildiği bir hata açıklaması (annotation) olarak
      # yayımlanır. Günlükte yalnızca test çıktısı bulunur.
      - name: Başarısız Rust testlerini özetle
        if: failure()
        shell: bash
        run: |
          [ -f rust-test.log ] || exit 0
          summary=$(grep -E "^---- |panicked at|assertion|left:|right:|kabul|korunan|Error|error\[" rust-test.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Başarısız Rust testleri::${summary}"

  audit:
    # Bağımlılık güvenlik taraması. Bilinen bir güvenlik açığı derlemeyi
    # durdurur; "bakımsız" gibi uyarılar yalnızca raporlanır.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit
