name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Sürüm tutarlılığı
        shell: pwsh
        run: ./scripts/check-version.ps1
      - run: npm ci
      - name: Arayüz tür denetimi
        run: npm run check
      - name: Arayüz derlemesi
        run: npm run build
      - name: Rust testleri
        working-directory: src-tauri
        run: cargo test --locked
